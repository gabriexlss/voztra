appId: com.transcrevedor.desktop
productName: Voztra
asar: true
directories:
  buildResources: build
  output: dist/work/${version}
files:
  - out/**/*
  - package.json
extraResources:
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  - from: LICENSE
    to: LICENSE.voztra.txt
  - from: release/core/transcrevedor-core
    to: core
win:
  executableName: voztra
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  artifactName: Voztra-${version}-win-${arch}-setup.${ext}
  shortcutName: Voztra
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  deleteAppDataOnUninstall: false
portable:
  artifactName: Voztra-${version}-win-${arch}-portable.${ext}
publish:
  provider: github
  owner: gabriexlss
  repo: voztra
  releaseType: draft
linux:
  executableName: voztra
  target:
    - AppImage
    - deb
  maintainer: gabriexlss
  category: AudioVideo
  artifactName: Voztra-${version}-linux-${arch}.${ext}
appImage:
  artifactName: Voztra-${version}-linux-${arch}.${ext}
npmRebuild: false

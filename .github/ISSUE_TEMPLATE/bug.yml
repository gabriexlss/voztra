name: Problema no aplicativo
description: Relate uma falha reproduzível
body:
  - type: input
    id: version
    attributes:
      label: Versão do Voztra e sistema operacional
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Passos, resultado esperado e resultado observado
      description: Não envie áudio pessoal, tokens ou histórico completo.
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: Modelo Whisper, compute type, CPU/GPU e RAM
